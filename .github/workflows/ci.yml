name: TableFlow CI

on:
  push:
    branches: [main, 'hardening/*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tableflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tableflow
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tableflow
      AUTH_SECRET: replace_with_ci_auth_secret_32_chars_min
      GUEST_COOKIE_SECRET: replace_with_ci_guest_secret_32_chars_min
      REALTIME_CHANNEL_SECRET: replace_with_ci_realtime_channel_secret_32_chars_min
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYMENTS_MOCK: "true"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm run audit:high

      - name: Secret scan
        run: npm run secret-scan:all

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit & integration test suite
        run: npm test

      - name: Production build check
        run: npm run build

  smoke-test:
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tableflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tableflow
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tableflow
      AUTH_SECRET: replace_with_ci_auth_secret_32_chars_min
      GUEST_COOKIE_SECRET: replace_with_ci_guest_secret_32_chars_min
      REALTIME_CHANNEL_SECRET: replace_with_ci_realtime_channel_secret_32_chars_min
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYMENTS_MOCK: "true"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Prisma generate, migrate & seed
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Run Playwright smoke test
        run: npm run test:smoke
