name: TableFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: node scripts/secret-scan.mjs --all

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit & security tests
        run: npm test

      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tableflow
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/tableflow
          AUTH_SECRET: replace_with_ci_auth_secret_32_chars_min
          GUEST_COOKIE_SECRET: replace_with_ci_guest_secret_32_chars_min
          CORS_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
